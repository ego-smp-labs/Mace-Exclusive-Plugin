settings:
  # Language: en or vi
  language: en
  # Can the mace be dropped by the player?
  allow-drop: true
  # Tracking mode: Strict Mode
  # If true: Player CANNOT drop the Mace or put it in any container (Chest, etc.).
  # Player CAN still use Anvil and Enchanting Table.
  strict-mode: false
  # If true AND strict-mode is true: When a player tries to store a mace,
  # the mace is dropped at their feet instead of just cancelling the action.
  strict-mode-drop: false
  # If true: Prevents hoppers and droppers from moving registered maces.
  prevent-hopper-pickup: true
  # Enables extra diagnostic logs.
  verbose: false

performance:
  # Main environment curse sweep interval. Higher values reduce inventory scans.
  # Blood/Sculk core instability still resolves every 10s; End core every 60s.
  environment-curse-interval-ticks: 100
  # Repeating task rate for passive held-item effects.
  holding-effect-tick-rate: 5
  # Effects when crafting the Mace for the first time.
  first-craft:
    glowing: true
    duration: 300 # seconds
  # Passive effects when holding the Mace.
  holding:
    glowing: false # Default false
    soul-particles: false # Default false
    particle-count: 5
    particle-offset-x: 0.3
    particle-offset-y: 0.1
    particle-offset-z: 0.3
    particle-extra: 0.05
  # Active effects during combat/usage.
  combat:
    # Custom message when killing a player with the Mace
    custom-kill-message: true
    # Ground slam effect (falling blocks) - WARNING: Can cause lag
    ground-slam:
      enabled: false
      radius: 3
      max-blocks: 64

crafting:
  remove-vanilla-mace-recipe: true
  prevent-shift-click: true

forge:
  # Block used as the direct craft forge base.
  block: LODESTONE
  # 3s visual charge before the long forge countdown.
  preforge-charge-seconds: 3
  preforge-explosion-power: 2.0
  # Default forge duration: 5 minutes.
  duration-seconds: 300
  completion-explosion-power: 4.0
  abort-explosion-power: 1.5
