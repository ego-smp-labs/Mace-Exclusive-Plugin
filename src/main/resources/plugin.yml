name: Mace-Exclusive
version: '1.0.8'
main: vn.nirussv.maceexclusive.MaceExclusivePlugin
api-version: '1.21'
prefix: Mace-Exclusive
authors: [NirussVn0]
depend: []
softdepend: []
commands:
  macee:
    description: Main command for Mace Exclusive
    usage: /macee help
    aliases: [me]
permissions:
  maceexclusive.command.info:
    description: Allows use of /macee info
    default: true
  maceexclusive.command.give:
    description: Allows use of /macee give
    default: op
  maceexclusive.command.reload:
    description: Allows use of /macee reload
    default: op
  maceexclusive.command.reset:
    description: Allows use of /macee reset
    default: op
  maceexclusive.admin:
    description: Allows full access to Mace Exclusive commands
    default: op
    children:
      maceexclusive.command.info: true
      maceexclusive.command.give: true
      maceexclusive.command.reload: true
      maceexclusive.command.reset: true
  mace.admin:
    description: Legacy full-access permission for existing server setups
    default: op
    children:
      maceexclusive.admin: true
